<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#8e303d"><title>文化祭トランシーバー管理</title><link rel="stylesheet" href="style.css?v=20261012-brand"></head>
<body><header><a href="./" class="brand"><img class="brand-logo" width="48" height="48" src="urakata_logo.svg" alt="裏方部"></a><button id="login" class="light">ログイン <span>↗</span></button></header>
<main><div class="eyebrow">裏方部</div><div class="titlebar"><div><h1>トランシーバー管理</h1></div><span class="viewbadge" id="viewbadge">◉ 閲覧モード</span></div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="管理番号・部署・担当者を検索" aria-label="機器を検索"></label><select id="filter" aria-label="状態で絞り込む"><option value="">すべての状態</option><option>貸出中</option><option>保管中</option><option>点検中</option></select><button id="add" hidden>＋ 機器を登録</button></section>
<div class="workspace"><aside><div class="sectionhead"><h2>機器一覧</h2><span id="count">—</span></div><div id="list" aria-live="polite"><p class="muted">読み込み中…</p></div><div class="asidefoot">QRから、この機器のページへ。<br>情報の閲覧にログインは必要ありません。</div></aside>
<section id="detail" class="detail" aria-live="polite"><div class="empty"><span>⌁</span><h2>機器を選択してください</h2><p>管理タグのQRを読み取るか、<br>一覧から確認する機器を選べます。</p></div></section></div>
<footer><span>裏方部 トランシーバー管理</span><span>編集にはアカウントが必要です</span></footer></main>
<dialog id="editor"><form id="form"><div class="sectionhead"><h2 id="formtitle">機器情報を編集</h2><button type="button" id="close" class="icon" aria-label="閉じる">×</button></div><p class="muted">保存するとQRのリンク先にも反映されます。</p><label>管理番号<input name="id" required maxlength="30" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,29}" placeholder="A-101"></label><div class="formgrid"><label>担当部署<input name="department" required maxlength="80" placeholder="本部"></label><label>チャンネル<input name="channel" required maxlength="20" placeholder="10"></label></div><label>担当者名<input name="assignee" maxlength="80" placeholder="未割当の場合は空欄"></label><label>状態<select name="status"><option>保管中</option><option>貸出中</option><option>点検中</option></select></label><label>備考<textarea name="note" maxlength="1000" rows="3"></textarea></label><p class="muted">担当者名・備考はログインなしで閲覧できます。</p><p id="formerror" role="alert"></p><button type="submit" id="save">変更を保存</button></form></dialog>
<script src="qrcode.js"></script><script type="module" src="app.js"></script></body></html>
