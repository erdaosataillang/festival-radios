<header><div class="header-title">領収書</div><a class="header-brand app-home" href="../">アプリ一覧</a></header>
<main><section id="input-view" class="view input-view" role="tabpanel" aria-labelledby="tab-input"><div class="panel"><h2>領収書の作成</h2>
<form id="form">
<label for="recipient">宛名 *</label><input id="recipient" required maxlength="100" value="[宛名]">
<div class="row"><div><label for="honorific">敬称</label><select id="honorific"><option>御中</option><option>様</option></select></div><div><label for="date">発行日 *</label><input id="date" type="date" required></div></div>
<label for="amount">金額（税込・円） *</label><input id="amount" type="number" min="1" max="999999999999" step="1" value="24000" required>
<label for="purpose">但し書き *</label><textarea id="purpose" maxlength="250" required>ECHO2026 機材レンタル費用として</textarea>
<label for="detail">内訳</label><input id="detail" value="ECHO2026 輸送費用" maxlength="150">
<div class="row"><div><label for="number">伝票No. *</label><input id="number" value="10" required maxlength="40"></div><div><label for="permanent">永久伝票No.</label><input id="permanent" value="20" maxlength="40"></div></div>
<details><summary>発行者情報・備考を編集</summary>
<label for="issuer">発行者名 *</label><input id="issuer" value="" placeholder="発行者名" maxlength="100" required>
<label for="address">住所</label><textarea id="address" maxlength="250" placeholder="郵便番号・住所"></textarea>
<label for="phone">電話番号</label><input id="phone" type="tel" maxlength="40" placeholder="例：090-0000-0000">
<label for="note">備考</label><textarea id="note" maxlength="400" placeholder="必要な場合に入力してください"></textarea>
</details>
<div class="actions"><button type="button" id="show-preview" class="primary">プレビュー</button><button type="button" id="save">履歴に保存</button></div><div class="status" id="status" role="status" aria-live="polite"></div>
</form></div></section>

y="191.73333333333332" text-anchor="middle" font-size="24.0" font-weight="700">24000</text><rect x="466" y="163.33333333333331" width="132" height="40.0" fill="#bfbfbf"/><path d="M466,201.83333333333331h132 M466,203.83333333333331h132" fill="none" stroke="black" stroke-width=".65"/><text x="468" y="191.73333333333332" text-anchor="start" font-size="24.0" font-weight="400">（税込）</text><text id="receipt-purpose" data-width="612" x="116" y="229.86666666666665" text-anchor="start" font-size="18.666666666666668" font-weight="400">但し 　ECHO2026 機材レンタル費用として</text><text x="116" y="268.93333333333334" text-anchor="start" font-size="16.0" font-weight="400">上記正に領収いたしました。</text><text x="200" y="347.93333333333334" text-anchor="end" font-size="16.0" font-weight="400">内　　訳</text><path d="M202,355.3333333333333h220" fill="none" stroke="black" stroke-width=".7"/><text id="receipt-detail" data-width="216" x="312.0" y="347.93333333333334" text-anchor="middle" font-size="16.0" font-weight="400">ECHO2026 輸送費用</text><text id="receipt-issuer" data-width="304" x="468" y="347.93333333333334" text-anchor="start" font-size="16.0" font-weight="400"></text><text x="200" y="373.93333333333334" text-anchor="end" font-size="16.0" font-weight="400">金　　額</text><path d="M202,381.3333333333333h220" fill="none" stroke="black" stroke-width=".7"/><text id="receipt-detail-amount" data-width="216" x="312.0" y="373.46666666666664" text-anchor="middle" font-size="14.666666666666666" font-weight="400">24000</text><text id="receipt-postal" data-width="304" x="468" y="373.93333333333334" text-anchor="start" font-size="16.0" font-weight="400"></text><text id="receipt-note" data-width="304" x="116" y="397.1333333333333" text-anchor="start" font-size="8.0" font-weight="400"></text><text id="receipt-address" data-width="304" x="468" y="399.93333333333334" text-anchor="start" font-size="16.0" font-weight="400"></text><text x="552" y="451.93333333333334" text-anchor="end" font-size="16.0" font-weight="400">TEL:</text><text id="receipt-phone" data-width="216" x="556" y="451.93333333333334" text-anchor="start" font-size="16.0" font-weight="400"></text><g stroke="#bfbfbf" fill="none" stroke-width="2.666"><rect x="6" y="330.3333333333333" width="81" height="103"/></g><g fill="#bfbfbf" font-size="18.666" text-anchor="middle"><text x="46.5" y="371.3333333333333">収　入</text><text x="46.5" y="398.3333333333333">印　紙</text></g><g id="receipt-seal"></g></svg></article></div><p class="hint">領収書のPDFを開き、PDF画面から印刷または保存してください。</p>
<p id="pdf-status" class="hint" role="status" aria-live="polite"></p><a id="pdf-download" hidden>PDFを保存</a><div class="actions preview-actions"><button type="button" id="print-preview" class="primary">印刷・PDF保存</button><button type="button" id="save-preview">履歴に保存</button></div></section><section id="history-view" class="view panel history" role="tabpanel" aria-labelledby="tab-history" hidden><div class="history-head"><h2>保存した領収書</h2><button id="new" type="button">次の領収書を作成</button></div><p class="hint">履歴はこのブラウザ内に保存されます。別の端末とは共有されません。</p><div id="history"></div></section>
<section id="seal-view" class="view input-view" role="tabpanel" aria-labelledby="tab-seal" hidden><div class="panel"><h2>印鑑</h2><label for="seal">領収書に使う印鑑</label><select id="seal"><option value="generated">作成した印鑑</option><option value="hide" selected>表示しない</option></select><div class="seal-preview-wrap"><svg id="seal-preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="作成する印鑑"></svg></div><label for="sealName">印鑑に入れる文字</label><input id="sealName" value="" maxlength="8" placeholder="8文字まで"><div class="row"><div><label for="sealShape">形</label><select id="sealShape"><option value="round">丸印</option><option value="square">角印</option></select></div><div><label for="sealFont">書体</label><select id="sealFont"><option value="mincho">明朝体</option><option value="gothic">ゴシック体</option></select></div></div><div class="actions"><button type="button" class="primary" id="apply-seal">領収書に使う</button><button type="button" id="save-seal">PNG保存</button></div><p id="seal-status" class="status" role="status" aria-live="polite"></p><p class="hint">印鑑画像と電子署名は別の機能です。</p><details class="signature-settings"><summary>PDFの電子署名</summary><label for="signatureMode">PDFへの電子署名</label><select id="signatureMode"><option value="unsigned">付けない</option><option value="signed">証明書を埋め込んで署名する</option></select><label for="certificateFile">電子証明書（.p12／.pfx、RSA）</label><input id="certificateFile" type="file" accept=".p12,.pfx,application/x-pkcs12"><label for="certificatePassword">証明書のパスワード</label><input id="certificatePassword" type="password" autocomplete="off"><div class="actions"><button type="button" id="load-certificate" class="primary">読み込む</button><button type="button" id="clear-certificate">解除</button></div><p id="certificate-status" class="status" role="status" aria-live="polite">証明書は未読み込みです。</p><p class="hint">証明書・秘密鍵・パスワードはサーバーに送信せず、この画面を閉じると解除されます。証明書の信頼性は、対応するPDF閲覧ソフトで確認してください。認証局のタイムスタンプ・長期署名には対応していません。</p></details></div></section><footer>履歴はこのブラウザに保存されます。</footer></main>
<nav class="bottom-nav" aria-label="領収書メニュー"><div class="nav-inner" role="tablist" aria-label="画面切り替え"><button id="tab-input" class="nav-item" type="button" role="tab" aria-selected="true" aria-controls="input-view" data-view="input"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3l7 7M4 20l4-1L20 7a2.1 2.1 0 0 0-3-3L5 16z"/></svg></span><span>入力</span></button><button id="tab-seal" class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="seal-view" data-view="seal"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 13V8a3 3 0 0 1 6 0v5l3 3v3H6v-3zM5 22h14"/></svg></span><span>印鑑</span></button><button id="tab-preview" class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="preview-view" data-view="preview"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><span>プレビュー</span></button><button id="tab-history" class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="history-view" data-view="history"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.5 7M3 4v7h7M12 7v5l3 2"/></svg></span><span>履歴</span></button></div></nav><script src="vendor/forge.min.js"></script><script src="certificate-signing.js"></script><script src="seal-generator.js"></script><script src="receipt-pdf.js"></script><script>
const ids=['recipient','honorific','date','amount','purpose','detail','number','permanent','issuer','address','phone','note','seal','sealName','sealShape','sealFont','signatureMode'];
const el=id=>document.getElementById(id);
el('date').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());
let history=[];try{const stored=JSON.parse(localStorage.getItem('urakata-receipts-v1')||'[]');if(Array.isArray(stored))history=stored.filter(x=>x&&x.data&&typeof x.id==='string').slice(0,50)}catch{}
function data(){return Object.fromEntries(ids.map(id=>[id,el(id).value]))}
function render(){
const d=data();if(el('pdf-download').dataset.signature!==JSON.stringify(d)){el('pdf-download').hidden=true;el('pdf-status').textContent=''}const set=(key,text)=>{const node=el('receipt-'+key);node.textContent=text||'';node.removeAttribute('textLength');node.removeAttribute('lengthAdjust');const max=Number(node.dataset.width);if(node.getComputedTextLength()>max){node.setAttribute('textLength',max);node.setAttribute('lengthAdjust','spacingAndGlyphs')}};
set('recipient',d.recipient);set('honorific',d.honorific);
const serial=v=>/^\d+$/.test(v)?v.padStart(5,'0'):v;
set('number',serial(d.number));set('permanent',serial(d.permanent));
const parts=d.date.split('-');set('date',parts.length===3?parts[0]+'年'+Number(parts[1])+'月'+Number(parts[2])+'日':'');
const n=Number(d.amount),value=d.amount&&Number.isFinite(n)?n.toLocaleString('ja-JP'):'';set('amount',value?'¥'+value:'');set('detail-amount',value);
set('purpose',d.purpose?'但し　'+d.purpose:'但し');set('detail',d.detail);set('issuer',d.issuer);
const lines=d.address.split('\n');const postal=/^(〒|[0-9０-９]{3}[-ー])/.test(lines[0]||'');set('postal',postal?lines.shift():'');set('address',lines.join(' '));set('phone',d.phone);
const node=el('receipt-note');node.replaceChildren();node.removeAttribute('textLength');node.removeAttribute('lengthAdjust');let line='',row=0;const x=node.getAttribute('x'),base=Number(node.getAttribute('y'));for(const ch of d.note){node.textContent=line+ch;if(ch==='\n'||node.getComputedTextLength()>Number(node.dataset.width)){const t=document.createElementNS('http://www.w3.org/2000/svg','tspan');t.setAttribute('x',x);t.setAttribute('y',base+row*11);t.textContent=line;(node._lines??=[]).push(t);row++;line=ch==='\n'?'':ch}else line+=ch}node.replaceChildren(...(node._lines||[]));delete node._lines;if(line){const t=document.createElementNS('http://www.w3.org/2000/svg','tspan');t.setAttribute('x',x);t.setAttribute('y',base+row*11);t.textContent=line;node.append(t)}
updateSealPreview(d);
}

function status(text){el('status').textContent=text}
function valid(){if(el('signatureMode').value==='signed'&&!receiptSigningIdentity){showView('seal');document.querySelector('.signature-settings').open=true;el('certificate-status').textContent='電子署名に使う証明書を読み込んでください。';return false}if(el('seal').value==='generated'&&!el('sealName').value.trim()){showView('seal');el('seal-status').textContent='印鑑に入れる文字を入力してください。';el('sealName').focus();return false}const form=el('form');if(!form.checkValidity()){showView('input');const invalid=form.querySelector(':invalid');if(invalid?.closest('details'))invalid.closest('details').open=true;form.reportValidity();return false}return true}
function renderHistory(){const root=el('history');root.replaceChildren();if(!history.length){const p=document.createElement('p');p.className='empty';p.textContent='保存した領収書はまだありません。';root.append(p);return}history.forEach(item=>{const row=document.createElement('div');row.className='entry';const text=document.createElement('div');text.textContent=item.data.recipient+' '+item.data.honorific;const sub=document.createElement('small');sub.textContent=item.data.date+' / No. '+item.data.number+' / ¥ '+Number(item.data.amount).toLocaleString('ja-JP');text.append(sub);const b=document.createElement('button');b.type='button';b.textContent='読み込む';b.onclick=()=>{ids.forEach(id=>el(id).value=item.data[id]||({seal:'hide',sealName:'',sealShape:'round',sealFont:'mincho',signatureMode:'unsigned'}[id]||''));showView('input');render();status('保存した内容を読み込みました。');window.scrollTo({top:0,behavior:'smooth'})};row.append(text,b);root.append(row)})}
el('form').addEventListener('input',()=>{render();status('')});
el('form').addEventListener('submit',e=>{e.preventDefault();openReceiptPdf() });
el('save').onclick=()=>{if(!valid())return;const d=data();const existing=history.findIndex(x=>x.data.number===d.number&&x.data.permanent===d.permanent);const item={id:globalThis.crypto?.randomUUID?.()||String(Date.now()),data:d};const next=history.slice();if(existing>=0)next.splice(existing,1);next.unshift(item);try{localStorage.setItem('urakata-receipts-v1',JSON.stringify(next.slice(0,50)));history=next.slice(0,50);renderHistory();status(existing>=0?'同じ伝票番号の履歴を更新しました。':'履歴に保存しました。')}catch{status('ブラウザの保存領域が使えません。印刷・PDF保存をご利用ください。')}};
el('new').onclick=()=>{const next=id=>{const v=el(id).value;if(/^\d+$/.test(v)&&Number.isSafeInteger(Number(v)+1))el(id).value=String(Number(v)+1)};next('number');next('permanent');el('recipient').value='';el('amount').value='';showView('input');render();status('番号を繰り上げました。新しい宛名・金額を入力してください。');el('recipient').focus();window.scrollTo({top:0,behavior:'smooth'})};

async function openReceiptPdf(){
if(!valid())return;showView('preview');render();
const button=el('print-preview');if(button.disabled)return;
const viewer=window.open('about:blank','_blank');if(viewer)viewer.opener=null;
button.disabled=true;button.textContent='PDF作成中…';el('pdf-status').textContent='';el('pdf-download').hidden=true;
try{const blob=await createReceiptPdf(document.querySelector('.receipt-svg'));const link=el('pdf-download');if(link.href.startsWith('blob:'))URL.revokeObjectURL(link.href);const url=URL.createObjectURL(blob);link.href=url;link.download='領収書_'+el('number').value.replace(/[\\/:*?"<>|]/g,'_')+'.pdf';link.dataset.signature=JSON.stringify(data());link.hidden=false;
if(viewer&&!viewer.closed){viewer.location.replace(url);el('pdf-status').textContent='PDFを開きました。PDF画面から印刷できます。'}else{link.click();el('pdf-status').textContent='PDFを保存して印刷してください。'}}catch(error){if(viewer&&!viewer.closed)viewer.close();el('pdf-status').textContent=error.message||'PDFの作成に失敗しました。もう一度お試しください。';console.error(error)}finally{button.disabled=false;button.textContent='印刷・PDF保存'}}
function showView(name){for(const key of ['input','seal','preview','history']){el(key+'-view').hidden=key!==name;el('tab-'+key).setAttribute('aria-selected',String(key===name))}window.scrollTo(0,0);if(name==='preview')render()}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>showView(button.dataset.view)));
el('print-preview').onclick=openReceiptPdf;
el('show-preview').onclick=()=>{if(valid())showView('preview')};
el('save-preview').onclick=()=>{if(valid()){el('save').click();if(el('status').textContent.includes('保存しました')||el('status').textContent.includes('更新しました'))showView('history')}};
document.querySelector('[role="tablist"]').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[role="tab"]')];let i=tabs.indexOf(document.activeElement);if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else i=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[i].focus();showView(tabs[i].dataset.view)});

['seal','sealName','sealShape','sealFont'].forEach(id=>el(id).addEventListener('input',()=>{render();el('seal-status').textContent=''}));
el('apply-seal').onclick=()=>{if(!el('sealName').value.trim()){el('seal-status').textContent='印鑑に入れる文字を入力してください。';return}el('seal').value='generated';render();showView('preview')};
el('save-seal').onclick=saveGeneratedSeal;
el('load-certificate').onclick=loadReceiptCertificate;el('clear-certificate').onclick=forgetReceiptCertificate;el('signatureMode').addEventListener('input',render);
render();renderHistory();
</script></html>
